<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6F0F5">
<title>おこづかい帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6F0F5; --surface:#FFFFFF; --surface-2:#F2F7FA; --ink:#1E3240; --muted:#5F7685; --line:#CADAE3;
  --accent:#2A76A0; --accent-soft:#DCEBF4;
  --in:#2D8659; --in-soft:#DDF0E5; --out:#B94A47; --out-soft:#F6E0DF;
  --t-hiyoko:#E9B825; --t-tora:#E7802F; --t-bison:#8A5A3B; --t-robot:#5E82A3; --t-hat:#5A3C8A;
  color-scheme:light;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111E27; --surface:#1A2B37; --surface-2:#22384A; --ink:#E4EDF2; --muted:#93A9B7; --line:#2C4455;
    --accent:#6FB3DA; --accent-soft:#1F3E52;
    --in:#6CC795; --in-soft:#1C3A2B; --out:#E68683; --out-soft:#432726;
    --t-hiyoko:#F2CB4D; --t-tora:#F0995A; --t-bison:#C08C68; --t-robot:#8FB0CF; --t-hat:#A88AD8;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.lock{overflow:hidden}
main{max-width:560px;margin:0 auto;padding:12px 16px 80px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:24px;font-weight:900;margin:0;letter-spacing:.02em}
h2{font-size:17px;font-weight:700;margin:0 0 8px}

.head{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:8px}
.icon-btn{border:0;background:transparent;font-size:22px;width:44px;height:44px;border-radius:12px}
.back{border:0;background:transparent;font-weight:700;color:var(--accent);padding:8px 4px;font-size:17px}

.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:17px;min-height:48px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.wide{display:block;width:100%}
.btn.primary{background:var(--accent);color:#fff}
.btn.in{background:var(--in);color:#fff}
.btn.out{background:var(--out);color:#fff}
.btn.ghost{background:transparent;border:2px dashed var(--line);color:var(--muted)}
.btn.line{background:var(--surface);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--out);border:1.5px solid var(--out)}
@media (prefers-color-scheme:dark){ .btn.primary,.btn.in,.btn.out{color:#10202A} }

/* お給料日 */
.payday{margin:4px 0 18px}
.btn.pay{width:100%;background:var(--surface);border:2px solid var(--t-hiyoko);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn.pay span{font-size:14px;color:var(--muted);font-weight:500}
.note{margin:6px 4px 0;font-size:13px;color:var(--muted)}

/* 園児カード */
.kids{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:12px}
.kid{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.kid-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{font-size:26px;width:42px;height:42px;display:grid;place-items:center;background:var(--surface-2);border-radius:50%}
.avatar.big{font-size:40px;width:68px;height:68px}
.name{font-weight:700;font-size:19px}

/* 残高ラック（いちばん大事な見た目） */
.rack{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{background:var(--surface-2);border-radius:12px 12px 6px 6px;padding:6px 0 3px;text-align:center;border-bottom:5px solid var(--tier)}
.slot .e{display:block;font-size:20px;line-height:1.3}
.slot .n{display:block;font-weight:900;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.3}
.slot.zero .e,.slot.zero .n{opacity:.3}
.rack.big{gap:8px;margin:0 0 6px}
.rack.big .slot{padding:10px 0 6px;border-bottom-width:7px}
.rack.big .slot .e{font-size:30px}
.rack.big .slot .n{font-size:28px}

.road{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.track{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;background:var(--t-hat);border-radius:99px}
.road.done span{color:var(--t-hat);font-weight:700}

/* 園児ページ */
.kid-hero{display:flex;align-items:center;gap:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.actions .btn{font-size:19px;min-height:56px}
.actions .btn.ex{grid-column:1 / -1;min-height:48px;font-size:17px;background:var(--surface);border:2px solid var(--t-robot);color:var(--ink)}
.w-label{margin:14px 0 6px;font-size:14px;color:var(--muted);font-weight:700}
.w-sum{margin:6px 2px 0;font-size:13px;color:var(--muted);text-align:right}
.rack.big + .w-sum{font-size:15px}
.l-amt.ex .amt-raw{color:var(--t-robot);font-size:14px}
.ex-note{text-align:center;font-weight:700;margin:10px 0}
.ex-list{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}
.ex-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex-row .btn{font-size:16px;padding:8px}
.warn{white-space:pre-line}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:8px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}

.log{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.log li{border-top:1px solid var(--line)}
.l-row{width:100%;display:grid;grid-template-columns:44px 1fr auto 14px;gap:8px;align-items:start;padding:12px 10px 12px 14px;border:0;background:transparent;text-align:left;border-radius:inherit}
.l-row .chev{color:var(--muted);padding-top:2px}
.log li:first-child{border-top:0}
.l-date{font-size:13px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.l-label{font-weight:700}
.l-memo{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.l-run{font-size:12px;color:var(--muted)}
.amt{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.amt-raw{font-weight:900;white-space:nowrap}
.amt-sum{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.l-amt{padding-top:1px}
.l-amt.in{color:var(--in)} .l-amt.out{color:var(--out)}
.del{border:0;background:transparent;color:var(--muted);font-size:18px;width:32px;height:32px;border-radius:8px}
.empty,.empty-s{color:var(--muted);text-align:center}
.empty{padding:40px 8px}
.empty-s{padding:14px 8px;font-size:14px;margin:0}

.log-info{margin:0 4px 4px;font-size:13px;color:var(--muted);text-align:right}
.log-month{font-size:15px;font-weight:700;margin:14px 4px 6px;color:var(--ink)}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:16px 0 8px}
.pager button{min-width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.pager button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){ .pager button[aria-current="page"]{color:#10202A} }
.pager button:disabled{opacity:.35}
.pager .dots{color:var(--muted);padding:0 2px}
.tabs.small{margin-bottom:10px}
.tabs.small button{padding:6px;font-size:15px}
.ylist{list-style:none;padding:0;margin:0}
.ylist button{width:100%;display:grid;grid-template-columns:48px 1fr 1fr;gap:8px;align-items:center;border:0;border-top:1px dashed var(--line);background:transparent;padding:8px 2px;text-align:right;font-size:15px}
.ylist li:first-child button{border-top:0}
.ylist .ym{text-align:left;font-weight:700}
.ylist .in{color:var(--in);font-weight:700} .ylist .out{color:var(--out);font-weight:700}
.hint{margin:8px 0 0;font-size:12px;color:var(--muted)}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month-nav button{border:1px solid var(--line);background:var(--surface);width:44px;height:40px;border-radius:12px;font-size:20px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.mbox h2{display:flex;justify-content:space-between}
.mbox h2{align-items:flex-start}
.m-head.in .amt-raw{color:var(--in)} .m-head.out .amt-raw{color:var(--out)}
.mlist{list-style:none;padding:0;margin:0}
.mlist li{display:grid;grid-template-columns:1fr auto auto;align-items:start;gap:12px;padding:6px 0;border-top:1px dashed var(--line);font-size:15px}
.mlist li:first-child{border-top:0}
.mlist .cnt{color:var(--muted)}

/* 設定 */
.set{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.set p{margin:0 0 10px;color:var(--muted);font-size:14px}
.plist{list-style:none;padding:0;margin:0 0 10px}
.plist button{width:100%;display:flex;justify-content:space-between;gap:10px;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 2px;text-align:left}
.plist li:first-child button{border-top:0}
.plist small{color:var(--muted);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
.filebtn{position:relative;display:flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* シート */
.sheet{position:fixed;inset:0;background:rgba(8,18,26,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.p-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.p-head h2{margin:0;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip-group{margin:4px 2px 6px;font-size:13px;font-weight:700;color:var(--muted)}
.plist + .chip-group{margin-top:12px}
.qty{display:grid;grid-template-columns:1fr 44px 56px 44px;align-items:center;gap:8px;margin:4px 0 10px;padding:8px 12px;border:1.5px solid var(--accent);border-radius:14px}
.qty span{font-weight:700}
.qty button{width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.qty button:disabled{opacity:.35}

.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:15px;display:flex;gap:6px;align-items:baseline}
.chip small{color:var(--muted);font-size:12px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}

.stepper{background:var(--surface-2);border-radius:16px;padding:8px 12px;margin-bottom:14px}
.st-row{display:grid;grid-template-columns:44px 44px 1fr 44px;align-items:center;gap:8px;padding:4px 0;border-left:5px solid var(--tier);padding-left:8px;margin:4px 0}
.st-e{font-size:24px}
.st-row button{width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.st-in,.qty input{width:100%;min-width:0;text-align:center;font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:4px 0;-moz-appearance:textfield}
.st-in::-webkit-inner-spin-button,.st-in::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button,.qty input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.st-total{text-align:right;padding:6px 2px 2px;color:var(--muted)}
.st-total strong{color:var(--ink);font-size:18px}

.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:16px}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
.icons button{font-size:24px;aspect-ratio:1;border-radius:12px;border:1.5px solid transparent;background:var(--surface-2)}
.icons button.on{border-color:var(--accent);background:var(--accent-soft)}
.warn{color:var(--out);font-size:14px;min-height:1.2em;margin:0 0 8px}
.gap{height:10px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== 通貨 ===== */
const UNITS = [
  { e:'🎩', v:10000, c:'var(--t-hat)' },
  { e:'🤖', v:1000,  c:'var(--t-robot)' },
  { e:'🦬', v:100,   c:'var(--t-bison)' },
  { e:'🐅', v:10,    c:'var(--t-tora)' },
  { e:'🐥', v:1,     c:'var(--t-hiyoko)' },
];
const HAT = 10000;
function split(n){ let r = Math.max(0, n); return UNITS.map(u => { const q = Math.floor(r / u.v); r -= q * u.v; return q; }); }
function total(c){ return c.reduce((s, q, i) => s + q * UNITS[i].v, 0); }
function compact(n){
  const s = split(n).map((q, i) => q ? q + UNITS[i].e : '').filter(Boolean).join('');
  return s || '0🐥';
}
function countsOf(t){ return Array.isArray(t.counts) ? t.counts : split(t.amount); }
function sumCounts(list){ return list.reduce((acc, t) => { const c = countsOf(t); return acc.map((q, i) => q + c[i]); }, [0,0,0,0,0]); }
function amtHtml(sign, c, cls){
  const n = total(c), raw = compactCounts(c), sum = compact(n);
  return `<div class="amt ${cls}"><span class="amt-raw">${sign}${raw}</span>${raw !== sum ? `<span class="amt-sum">合計 ${sum}</span>` : ''}</div>`;
}
function compactCounts(c){ return c.map((q,i)=> q ? q + UNITS[i].e : '').filter(Boolean).join('') || '0🐥'; }
function rack(c, big){
  return `<div class="rack${big?' big':''}">` + c.map((q, i) =>
    `<div class="slot${q?'':' zero'}" style="--tier:${UNITS[i].c}"><span class="e">${UNITS[i].e}</span><span class="n">${q}</span></div>`
  ).join('') + `</div>`;
}
function road(b){
  if (b >= HAT) return `<div class="road done"><div class="track"><i style="width:100%"></i></div><span>🎩 イベントに参加できるよ</span></div>`;
  return `<div class="road"><div class="track"><i style="width:${(b / HAT * 100).toFixed(1)}%"></i></div><span>🎩まで あと${compact(HAT - b)}</span></div>`;
}

/* ===== データ ===== */
const KEY = 'okozukai-chou-v1';
const KID_ICONS = ['🐥','🐅','🦬','🤖','🎩','🧶'];
/* 文房具屋さんのおねだん表 */
const SHOP_RAW = [
  ['s-paper-white', '📄', '白い大きな画用紙（1枚）',     [0,0,0,0,5], '画用紙'],
  ['s-paper-color', '🎨', '色つき大きな画用紙（1枚）',   [0,0,0,1,2], '画用紙'],
  ['s-paper-b5',    '🟩', 'B5色画用紙（1枚）',           [0,0,0,0,3], '画用紙'],
  ['s-paper-card',  '🟦', 'ハガキサイズ色画用紙（1枚）', [0,0,0,0,1], '画用紙'],
  ['s-paper-thick', '📦', '厚紙 白／茶（1枚）',          [0,0,0,0,2], '画用紙'],
  ['s-ori-1',       '🔶', 'ふつうの折り紙（1枚）',       [0,0,0,0,1], '折り紙'],
  ['s-ori-3',       '🔷', '折り紙まとめ買い（3枚）',     [0,0,0,0,2], '折り紙'],
  ['s-ori-kira',    '✨', 'キラキラ折り紙（1枚）',       [0,0,0,0,3], '折り紙'],
  ['s-seal-3',      '💗', 'シール（3枚）',               [0,0,0,0,1], 'シール'],
  ['s-seal-5',      '💖', 'シールまとめ買い（5枚）',     [0,0,0,0,2], 'シール'],
  ['s-tape-10',     '🎀', 'マステ（10cm）',              [0,0,0,0,1], 'マステ'],
  ['s-tape-30',     '🌸', 'マステ 同じ柄（30cm）',       [0,0,0,0,2], 'マステ'],
  ['s-tape-3x10',   '🌈', 'マステ 違う柄（3柄×10cm）',   [0,0,0,0,2], 'マステ'],
];
const SHOP = SHOP_RAW.map(([id, icon, label, counts, group]) => ({ id, icon, label, counts, amount:total(counts), group }));
const pCounts = p => Array.isArray(p.counts) ? [...p.counts] : split(p.amount);
function groupPresets(list){
  const m = new Map();
  list.forEach(p => { const g = p.group || 'そのほか'; if (!m.has(g)) m.set(g, []); m.get(g).push(p); });
  const arr = [...m.entries()];
  return arr.filter(([g]) => g !== 'そのほか').concat(arr.filter(([g]) => g === 'そのほか'));
}
function migrate(s){
  if (!s.settings.shopV2){
    const old = ['p-seal','p-tape','p-paper'];
    const rest = s.settings.presets.out.filter(p => !old.includes(p.id));
    rest.forEach(p => { if (['p-snack','p-juice','p-event'].includes(p.id) && !p.group) p.group = 'おやつ・イベント'; });
    s.settings.presets.out = [...SHOP.map(x => ({ ...x, counts:[...x.counts] })), ...rest];
    s.settings.shopV2 = true;
  }
  return s;
}
function defaults(){
  return {
    kids: [], tx: [],
    settings: {
      shopV2: true,
      payday: 500, // 4🦬8🐅20🐥
      payCounts: [0,0,4,8,20],
      presets: {
        in: [
          { id:'p-katazuke',  icon:'🧹', label:'お片付け',       amount:50 },
          { id:'p-otetsudai', icon:'🙌', label:'お手伝い',       amount:50 },
          { id:'p-leader',    icon:'🚩', label:'リーダーシップ', amount:200 },
          { id:'p-challenge', icon:'⭐', label:'チャレンジ',     amount:200 },
          { id:'p-in-other',  icon:'🎁', label:'そのほか',       amount:0 },
        ],
        out: [
          ...SHOP.map(x => ({ ...x, counts:[...x.counts] })),
          { id:'p-snack',     icon:'🍪', label:'おやつおかわり',   amount:30,    group:'おやつ・イベント' },
          { id:'p-juice',     icon:'🧃', label:'ジュースおかわり', amount:30,    group:'おやつ・イベント' },
          { id:'p-event',     icon:'🎪', label:'イベント参加',     amount:10000, group:'おやつ・イベント' },
          { id:'p-out-other', icon:'🛍️', label:'そのほか',         amount:0 },
        ],
      },
    },
  };
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.kids) && Array.isArray(s.tx)) return s; } catch(e) {}
  return defaults();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e) { toast('保存できませんでした。ブラウザの設定を確認してください'); }
}
let S = migrate(load());
save();

/* ===== ユーティリティ ===== */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const md = s => `${+s.slice(5,7)}/${+s.slice(8,10)}`;
const kid = id => S.kids.find(k => k.id === id);
function txDelta(t){
  if (t.type === 'ex') return t.delta;
  const c = countsOf(t);
  return t.type === 'in' ? c : c.map(q => -q);
}
const addVec = (a, b) => a.map((q, i) => q + b[i]);
const holdings = (id, exclude) => S.tx.filter(t => t.kid === id && t.id !== exclude).reduce((acc, t) => addVec(acc, txDelta(t)), [0,0,0,0,0]);
const balance = id => total(holdings(id));
function exText(d){
  const give = d.map(q => q < 0 ? -q : 0), get = d.map(q => q > 0 ? q : 0);
  return `${compactCounts(give)} → ${compactCounts(get)}`;
}
function shiftYM(ym, d){ let [y, m] = ym.split('-').map(Number); m += d; while (m < 1){ m += 12; y--; } while (m > 12){ m -= 12; y++; } return `${y}-${String(m).padStart(2,'0')}`; }
let toastTimer;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000); }

/* ===== 画面 ===== */
const $app = document.getElementById('app');
let view = { name:'home' };
let sheet = null;
function go(v){ view = v; render(); window.scrollTo(0, 0); }
function render(){
  if (view.name === 'kid') renderKid();
  else if (view.name === 'settings') renderSettings();
  else renderHome();
}

function renderHome(){
  let h = `<div class="head"><h1>おこづかい帳</h1><button class="icon-btn" data-act="settings" aria-label="設定">⚙️</button></div>`;
  if (!S.kids.length){
    h += `<div class="empty"><p>まずは園児を登録しましょう。</p><button class="btn primary" data-act="kid-new">園児を追加する</button></div>`;
    $app.innerHTML = h; return;
  }
  const ym = today().slice(0, 7);
  const paid = S.tx.find(t => t.payday && t.date.startsWith(ym));
  h += `<section class="payday">
    <button class="btn pay" data-act="payday">💰 お給料日<span>${compactCounts(S.settings.payCounts)}ずつ</span></button>
    <p class="note">${paid ? `今月は${md(paid.date)}に支給済み` : '今月はまだ支給していません'}</p>
  </section>`;
  h += `<ul class="kids">` + S.kids.map(k => {
    const h = holdings(k.id), b = total(h);
    return `<li><button class="kid" data-act="open-kid" data-id="${k.id}">
      <div class="kid-top"><span class="avatar">${k.icon}</span><span class="name">${esc(k.name)}</span></div>
      ${rack(h)}<p class="w-sum">合計 ${compact(b)}</p>${road(b)}
    </button></li>`;
  }).join('') + `</ul>`;
  h += `<button class="btn ghost wide" data-act="kid-new">＋ 園児を追加する</button>`;
  $app.innerHTML = h;
}

function renderKid(){
  const k = kid(view.id);
  if (!k){ go({ name:'home' }); return; }
  const hold = holdings(k.id), b = total(hold);
  const tab = view.tab || 'log';
  let h = `<div class="head"><button class="back" data-act="home">‹ 一覧</button><button class="icon-btn" data-act="kid-edit" aria-label="園児を編集">✏️</button></div>
    <div class="kid-hero"><span class="avatar big">${k.icon}</span><h1>${esc(k.name)}</h1></div>
    <p class="w-label">おさいふの中</p>
    ${rack(hold, true)}<p class="w-sum">合計 ${compact(b)}</p>${road(b)}
    <div class="actions">
      <button class="btn in" data-act="rec" data-type="in">もらう</button>
      <button class="btn out" data-act="rec" data-type="out">つかう</button>
      <button class="btn ex" data-act="ex">🔁 りょうがえ</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="${tab === 'log'}" data-act="tab" data-tab="log">きろく</button>
      <button role="tab" aria-selected="${tab === 'month'}" data-act="tab" data-tab="month">まとめ</button>
    </div>`;
  h += tab === 'log' ? logHtml(k) : summaryHtml(k);
  $app.innerHTML = h;
}

const PER_PAGE = 20;
function txRow({ t, run }){
  return `<li><button class="l-row" data-act="tx-edit" data-id="${t.id}" aria-label="${md(t.date)} ${esc(t.label)} を直す">
    <div class="l-date">${md(t.date)}</div>
    <div><div class="l-label">${t.icon} ${esc(t.label)}${t.qty > 1 ? ` ×${t.qty}` : ''}</div>${t.memo ? `<div class="l-memo">${esc(t.memo)}</div>` : ''}<div class="l-run">のこり ${compactCounts(run)}</div></div>
    ${t.type === 'ex' ? `<div class="amt l-amt ex"><span class="amt-raw">${exText(t.delta)}</span></div>` : amtHtml(t.type === 'in' ? '＋' : '−', countsOf(t), 'l-amt ' + t.type)}
    <span class="chev" aria-hidden="true">›</span>
  </button></li>`;
}
function pager(page, pages){
  if (pages <= 1) return '';
  const nums = [];
  for (let i = 1; i <= pages; i++){
    if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i);
    else if (nums[nums.length - 1] !== '…') nums.push('…');
  }
  return `<nav class="pager" aria-label="ページ">
    <button data-act="page" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="前のページ">‹</button>
    ${nums.map(n => n === '…' ? `<span class="dots">…</span>` : `<button data-act="page" data-p="${n}" ${n === page ? 'aria-current="page"' : ''}>${n}</button>`).join('')}
    <button data-act="page" data-p="${page + 1}" ${page >= pages ? 'disabled' : ''} aria-label="次のページ">›</button>
  </nav>`;
}
function logHtml(k){
  const list = S.tx.filter(t => t.kid === k.id).sort((a, b) => a.date.localeCompare(b.date) || a.at - b.at);
  if (!list.length) return `<p class="empty-s">まだ記録がありません。「もらう」「つかう」から記録できます。</p>`;
  let run = [0,0,0,0,0];
  const rows = list.map(t => { run = addVec(run, txDelta(t)); return { t, run }; }).reverse();
  const pages = Math.ceil(rows.length / PER_PAGE);
  const page = Math.min(Math.max(1, view.page || 1), pages);
  const slice = rows.slice((page - 1) * PER_PAGE, page * PER_PAGE);
  // 月ごとに見出しをつける
  const groups = [];
  slice.forEach(r => {
    const ym = r.t.date.slice(0, 7);
    if (!groups.length || groups[groups.length - 1].ym !== ym) groups.push({ ym, rows:[] });
    groups[groups.length - 1].rows.push(r);
  });
  const from = (page - 1) * PER_PAGE + 1, to = from + slice.length - 1;
  return `<p class="log-info">全${rows.length}件中 ${from}〜${to}件目</p>` +
    groups.map(g => `<h3 class="log-month">${ymLabel(g.ym)}</h3><ul class="log">${g.rows.map(txRow).join('')}</ul>`).join('') +
    pager(page, pages);
}
const ymLabel = ym => `${ym.slice(0, 4)}年${+ym.slice(5, 7)}月`;

function summaryHtml(k){
  const span = view.span || 'month';
  const ym = view.month || today().slice(0, 7);
  const yy = view.year || today().slice(0, 4);
  const prefix = span === 'month' ? ym : yy;
  const list = S.tx.filter(t => t.kid === k.id && t.date.startsWith(prefix));
  const group = type => {
    const m = new Map();
    list.filter(t => t.type === type).forEach(t => {
      const key = `${t.icon} ${t.label}`;
      const g = m.get(key) || { n:0, sum:0, list:[] }; g.n += (t.qty || 1); g.sum += t.amount; g.list.push(t); m.set(key, g);
    });
    return [...m.entries()].sort((a, b) => b[1].sum - a[1].sum);
  };
  const rows = g => g.length
    ? `<ul class="mlist">` + g.map(([key, v]) => `<li><span>${esc(key)}</span><span class="cnt">×${v.n}</span>${amtHtml('', sumCounts(v.list), 'm-amt')}</li>`).join('') + `</ul>`
    : `<p class="empty-s">なし</p>`;
  const head2 = (type, label, sign) => `<h2><span>${label}</span>${amtHtml(sign, sumCounts(list.filter(t => t.type === type)), 'm-head ' + type)}</h2>`;

  let h = `<div class="tabs small" role="tablist">
      <button role="tab" aria-selected="${span === 'month'}" data-act="span" data-span="month">月ごと</button>
      <button role="tab" aria-selected="${span === 'year'}" data-act="span" data-span="year">年ごと</button>
    </div>
    <div class="month-nav">
      <button data-act="period" data-d="-1" aria-label="${span === 'month' ? '前の月' : '前の年'}">‹</button>
      <strong>${span === 'month' ? ymLabel(ym) : `${yy}年`}</strong>
      <button data-act="period" data-d="1" aria-label="${span === 'month' ? '次の月' : '次の年'}">›</button>
    </div>`;

  if (span === 'year'){
    const months = [];
    for (let m = 1; m <= 12; m++){
      const key = `${yy}-${String(m).padStart(2, '0')}`;
      const ml = list.filter(t => t.date.startsWith(key));
      if (!ml.length) continue;
      const tin = ml.filter(t => t.type === 'in').reduce((s, t) => s + t.amount, 0);
      const tout = ml.filter(t => t.type === 'out').reduce((s, t) => s + t.amount, 0);
      months.push(`<li><button data-act="open-month" data-ym="${key}"><span class="ym">${m}月</span><span class="in">＋${compact(tin)}</span><span class="out">−${compact(tout)}</span></button></li>`);
    }
    h += `<div class="mbox"><h2><span>月ごとの動き</span></h2>${months.length ? `<ul class="ylist">${months.join('')}</ul><p class="hint">月をタップすると、その月のまとめを開きます</p>` : '<p class="empty-s">なし</p>'}</div>`;
  }
  h += `<div class="mbox">${head2('in', 'もらった', '＋')}${rows(group('in'))}</div>
    <div class="mbox">${head2('out', 'つかった', '−')}${rows(group('out'))}</div>`;
  return h;
}

function renderSettings(){
  const plist = type => groupPresets(S.settings.presets[type]).map(([g, items]) => `<p class="chip-group">${esc(g)}</p><ul class="plist">` + items.map(p =>
    `<li><button data-act="preset-edit" data-type="${type}" data-id="${p.id}"><span>${p.icon} ${esc(p.label)}</span><small>${p.amount ? compactCounts(pCounts(p)) : 'その都度'}</small></button></li>`
  ).join('') + `</ul>`).join('') + `<button class="btn ghost wide" data-act="preset-new" data-type="${type}">＋ 項目を追加する</button>`;
  $app.innerHTML = `<div class="head"><button class="back" data-act="home">‹ 一覧</button><h1>設定</h1><span style="width:44px"></span></div>
    <section class="set"><h2>お給料日の支給額</h2><p>いまは1人あたり ${compactCounts(S.settings.payCounts)}（🐥換算で${S.settings.payday}）</p>
      <button class="btn line wide" data-act="pay-edit">支給額を変える</button></section>
    <section class="set"><h2>もらう項目</h2>${plist('in')}</section>
    <section class="set"><h2>つかう項目</h2>${plist('out')}</section>
    <section class="set"><h2>バックアップ</h2>
      <p>記録はこの端末のブラウザに保存されています。機種変更やもしものときのために、ときどきファイルに書き出しておくと安心です。</p>
      <div class="row"><button class="btn line" data-act="export">書き出す</button>
      <label class="btn line filebtn">読み込む<input type="file" id="import" accept="application/json,.json"></label></div></section>
    <section class="set"><h2>リセット</h2><p>園児と記録をすべて消して、最初の状態に戻します。</p>
      <button class="btn danger wide" data-act="reset">すべてのデータを消す</button></section>`;
}

/* ===== シート ===== */
function stepper(c){
  return `<div class="stepper">` + UNITS.map((u, i) => `<div class="st-row" style="--tier:${u.c}">
      <span class="st-e">${u.e}</span>
      <button data-act="st" data-i="${i}" data-d="-1" aria-label="${u.e}を1つ減らす">−</button>
      <input id="st-${i}" class="st-in" type="number" inputmode="numeric" min="0" step="1" value="${c[i]}" aria-label="${u.e}の数">
      <button data-act="st" data-i="${i}" data-d="1" aria-label="${u.e}を1つ増やす">＋</button>
    </div>`).join('') + `<div class="st-total">合計 <strong id="st-total">${compactCounts(c)}</strong></div></div>`;
}
const head = title => `<div class="p-head"><h2>${title}</h2><button class="icon-btn" data-act="close" aria-label="閉じる">✕</button></div>`;

function sheetBody(){
  const s = sheet;
  if (s.kind === 'rec'){
    const k = kid(view.id);
    const ps = S.settings.presets[s.type];
    const selP = ps.find(p => p.id === s.presetId);
    return head(s.editId ? `${k.icon} 記録を直す（${s.type === 'in' ? 'もらう' : 'つかう'}）` : `${k.icon} ${esc(k.name)}が${s.type === 'in' ? 'もらう' : 'つかう'}`) +
      (s.editId && !selP ? `<p class="ex-note">いまの項目：${s.origIcon} ${esc(s.origLabel)}（変えるときは下から選んでね）</p>` : '') +
      groupPresets(ps).map(([g, items]) => `<p class="chip-group">${esc(g)}</p><div class="chips">${items.map(p => `<button class="chip${p.id === s.presetId ? ' on' : ''}" data-act="pick" data-id="${p.id}">${p.icon} ${esc(p.label)}${p.amount ? `<small>${compactCounts(pCounts(p))}</small>` : ''}</button>`).join('')}</div>`).join('') +
      (selP && selP.amount ? `<div class="qty"><span>いくつ？</span><button data-act="qty" data-d="-1" aria-label="1つ減らす" ${s.qty <= 1 ? 'disabled' : ''}>−</button><input id="f-qty" type="number" inputmode="numeric" min="1" step="1" value="${s.qty}" aria-label="個数"><button data-act="qty" data-d="1" aria-label="1つ増やす">＋</button></div>` : '') +
      stepper(s.counts) +
      `<label class="field"><span>メモ（なくてもOK）</span><input id="f-memo" value="${esc(s.memo)}" placeholder="${s.type === 'in' ? '例：はじめて鉄棒にチャレンジ' : '例：ピンクのシール'}"></label>
       <label class="field"><span>日付</span><input type="date" id="f-date" value="${s.date}"></label>
       <p class="warn" id="warn"></p>
       <button class="btn ${s.type} wide" id="save" data-act="rec-save">${s.editId ? '保存する' : '記録する'}</button>
       ${s.editId ? `<div class="gap"></div><button class="btn danger wide" data-act="tx-del">この記録を削除する</button>` : ''}`;
  }
  if (s.kind === 'ex'){
    const k = kid(view.id);
    const cur = addVec(s.base, s.delta);
    const pairs = [3, 2, 1, 0].map(i => { // i = 上の動物, i+1 = 下の動物
      const hi = UNITS[i].e, lo = UNITS[i + 1].e;
      return `<li class="ex-row">
        <button class="btn line" data-act="ex-up" data-i="${i}" ${cur[i + 1] >= 10 ? '' : 'disabled'}>10${lo} → 1${hi}</button>
        <button class="btn line" data-act="ex-down" data-i="${i}" ${cur[i] >= 1 ? '' : 'disabled'}>1${hi} → 10${lo}</button>
      </li>`;
    }).join('');
    const changed = s.delta.some(q => q !== 0);
    return head(s.editId ? `🔁 りょうがえを直す` : `🔁 ${esc(k.name)}のりょうがえ`) +
      `<p class="w-label">りょうがえ後のおさいふ</p>${rack(cur)}
       <p class="ex-note">${changed ? exText(s.delta) : 'ボタンを押すたびに1回ぶん両替します'}</p>
       <ul class="ex-list">${pairs}</ul>
       <div class="row"><button class="btn line" data-act="ex-all">ぜんぶ両替する</button><button class="btn line" data-act="ex-reset" ${changed ? '' : 'disabled'}>やり直す</button></div>
       <div class="gap"></div>
       <label class="field"><span>日付</span><input type="date" id="f-date" value="${s.date}"></label>
       <button class="btn primary wide" id="save" data-act="ex-save">${s.editId ? '保存する' : '記録する'}</button>
       ${s.editId ? `<div class="gap"></div><button class="btn danger wide" data-act="tx-del">この記録を削除する</button>` : ''}`;
  }
  if (s.kind === 'pay'){
    const ym = s.date.slice(0, 7);
    const paid = S.tx.some(t => t.payday && t.date.startsWith(ym));
    return head('💰 お給料日') +
      `<p>園児${S.kids.length}人に、${compactCounts(S.settings.payCounts)}ずつ支給します。</p>
       <label class="field"><span>日付</span><input type="date" id="f-date" value="${s.date}"></label>
       <p class="warn" id="warn">${paid ? 'この月はすでに支給済みです。もう一度支給する場合だけ進めてください。' : ''}</p>
       <button class="btn primary wide" id="save" data-act="pay-save">全員に支給する</button>`;
  }
  if (s.kind === 'payamt'){
    return head('支給額を変える') + stepper(s.counts) +
      `<p class="warn" id="warn"></p><button class="btn primary wide" id="save" data-act="payamt-save">保存する</button>`;
  }
  if (s.kind === 'kid'){
    return head(s.id ? '園児を編集' : '園児を追加') +
      `<label class="field"><span>なまえ</span><input id="f-name" value="${esc(s.name)}" placeholder="例：はるちゃん" autocomplete="off"></label>
       <div class="field"><span>マーク</span></div>
       <div class="icons">${KID_ICONS.map(ic => `<button class="${ic === s.icon ? 'on' : ''}" data-act="kid-icon" data-icon="${ic}" aria-label="${ic}">${ic}</button>`).join('')}</div>
       <p class="warn" id="warn"></p>
       <button class="btn primary wide" id="save" data-act="kid-save">${s.id ? '保存する' : '登録する'}</button>
       ${s.id ? `<div class="gap"></div><button class="btn danger wide" data-act="kid-del">この園児を削除する</button>` : ''}`;
  }
  if (s.kind === 'preset'){
    return head(`${s.type === 'in' ? 'もらう' : 'つかう'}項目を${s.id ? '編集' : '追加'}`) +
      `<label class="field"><span>なまえ</span><input id="f-label" value="${esc(s.label)}" placeholder="例：おかたづけ名人"></label>
       <label class="field"><span>マーク（絵文字1つ）</span><input id="f-icon" value="${esc(s.icon)}" maxlength="4"></label>
       <label class="field"><span>グループ（例：画用紙、折り紙。空ならそのほか）</span><input id="f-group" value="${esc(s.group)}" list="groups"></label>
       <datalist id="groups">${[...new Set(S.settings.presets[s.type].map(p => p.group).filter(Boolean))].map(g => `<option value="${esc(g)}">`).join('')}</datalist>
       <div class="field"><span>いつもの金額（0のままなら毎回入力）</span></div>
       ${stepper(s.counts)}
       <p class="warn" id="warn"></p>
       <button class="btn primary wide" id="save" data-act="preset-save">保存する</button>
       ${s.id ? `<div class="gap"></div><button class="btn danger wide" data-act="preset-del">この項目を削除する</button>` : ''}`;
  }
  return '';
}
function renderSheet(){
  const el = document.getElementById('sheet');
  if (!sheet){ el.hidden = true; el.innerHTML = ''; document.body.classList.remove('lock'); return; }
  el.hidden = false; document.body.classList.add('lock');
  el.innerHTML = `<div class="panel" role="dialog" aria-modal="true">${sheetBody()}</div>`;
  validate();
}
function openSheet(s){ sheet = s; renderSheet(); }
function closeSheet(){ sheet = null; renderSheet(); }

function validate(){
  const btn = document.getElementById('save'); if (!btn || !sheet) return;
  const w = document.getElementById('warn');
  let ok = true, msg = null;
  if (sheet.kind === 'rec'){
    const t = total(sheet.counts);
    if (t <= 0 || !sheet.date) ok = false;
    else if (sheet.type === 'out'){
      const h = holdings(view.id, sheet.editId);
      const short = sheet.counts.map((q, i) => q > h[i] ? i : -1).filter(i => i >= 0);
      if (short.length){
        ok = false;
        msg = short.map(i => `${UNITS[i].e}が足りません（持っているのは${h[i]}${UNITS[i].e}）`).join('\n') + '\n先にりょうがえするか、払う動物を変えてください';
      }
    }
  }
  if (sheet.kind === 'pay') ok = !!sheet.date;
  if (sheet.kind === 'ex') ok = sheet.delta.some(q => q !== 0) && !!sheet.date;
  if (sheet.kind === 'payamt') ok = total(sheet.counts) > 0;
  if (sheet.kind === 'kid') ok = sheet.name.trim().length > 0;
  if (sheet.kind === 'preset') ok = sheet.label.trim().length > 0 && sheet.icon.trim().length > 0;
  btn.disabled = !ok;
  if (w && msg !== null) w.textContent = msg;
  else if (w && sheet.kind === 'rec') w.textContent = '';
}

/* ===== 操作 ===== */
document.addEventListener('click', e => {
  if (e.target.id === 'sheet'){ closeSheet(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;

  switch (a){
    case 'home': go({ name:'home' }); break;
    case 'settings': go({ name:'settings' }); break;
    case 'open-kid': go({ name:'kid', id:t.dataset.id, tab:'log', page:1 }); break;
    case 'tab': view.tab = t.dataset.tab; render(); break;
    case 'span': view.span = t.dataset.span; render(); break;
    case 'period':
      if ((view.span || 'month') === 'month') view.month = shiftYM(view.month || today().slice(0, 7), +t.dataset.d);
      else view.year = String(+(view.year || today().slice(0, 4)) + +t.dataset.d);
      render(); break;
    case 'open-month': view.span = 'month'; view.month = t.dataset.ym; render(); break;
    case 'page': {
      view.page = +t.dataset.p; render();
      const tabs = document.querySelector('.tabs'); if (tabs) tabs.scrollIntoView({ block:'start' });
      break;
    }
    case 'close': closeSheet(); break;

    case 'rec': {
      const type = t.dataset.type;
      const p = S.settings.presets[type][0];
      openSheet({ kind:'rec', type, presetId:p ? p.id : null, qty:1, counts:p ? pCounts(p) : [0,0,0,0,0], memo:'', date:today() });
      break;
    }
    case 'pick': {
      const p = S.settings.presets[sheet.type].find(x => x.id === t.dataset.id);
      sheet.presetId = p.id; sheet.qty = 1; sheet.counts = pCounts(p);
      renderSheet(); break;
    }
    case 'qty': {
      const p = S.settings.presets[sheet.type].find(x => x.id === sheet.presetId);
      sheet.qty = Math.max(1, sheet.qty + +t.dataset.d);
      sheet.counts = pCounts(p).map(q => q * sheet.qty);
      renderSheet(); break;
    }
    case 'st': {
      const i = +t.dataset.i;
      sheet.counts[i] = Math.max(0, sheet.counts[i] + +t.dataset.d);
      document.getElementById('st-' + i).value = sheet.counts[i];
      document.getElementById('st-total').textContent = compactCounts(sheet.counts);
      validate(); break;
    }
    case 'rec-save': {
      const sel = S.settings.presets[sheet.type].find(x => x.id === sheet.presetId);
      const p = sel || (sheet.editId ? { icon:sheet.origIcon, label:sheet.origLabel } : { icon:sheet.type === 'in' ? '🎁' : '🛍️', label:'そのほか' });
      const amount = total(sheet.counts), type = sheet.type, counts = [...sheet.counts];
      const qty = sel && sel.amount ? sheet.qty : 1;
      const data = { kid:view.id, date:sheet.date, type, presetId:sel ? sel.id : null, icon:p.icon, label:p.label, qty, amount, counts, memo:sheet.memo.trim() };
      if (sheet.editId){
        Object.assign(S.tx.find(x => x.id === sheet.editId), data);
        save(); closeSheet(); render(); toast('記録を直しました');
      } else {
        S.tx.push({ id:uid(), ...data, at:Date.now() });
        view.page = 1; save(); closeSheet(); render();
        toast(`${p.label} ${type === 'in' ? '＋' : '−'}${compactCounts(counts)} を記録しました`);
      }
      break;
    }

    case 'ex': openSheet({ kind:'ex', base:holdings(view.id), delta:[0,0,0,0,0], date:today() }); break;
    case 'ex-up': case 'ex-down': {
      const i = +t.dataset.i, up = a === 'ex-up';
      sheet.delta[i] += up ? 1 : -1; sheet.delta[i + 1] += up ? -10 : 10;
      renderSheet(); break;
    }
    case 'ex-all': {
      const target = split(total(sheet.base));
      sheet.delta = target.map((q, i) => q - sheet.base[i]);
      renderSheet(); break;
    }
    case 'ex-reset': sheet.delta = [0,0,0,0,0]; renderSheet(); break;
    case 'ex-save': {
      const d = [...sheet.delta];
      if (sheet.editId){
        Object.assign(S.tx.find(x => x.id === sheet.editId), { date:sheet.date, delta:d });
        save(); closeSheet(); render(); toast('記録を直しました'); break;
      }
      view.page = 1; S.tx.push({ id:uid(), kid:view.id, date:sheet.date, type:'ex', icon:'🔁', label:'りょうがえ', amount:0, delta:d, memo:'', at:Date.now() });
      save(); closeSheet(); render(); toast(`${exText(d)} を記録しました`); break;
    }
    case 'payday': openSheet({ kind:'pay', date:today() }); break;
    case 'pay-save': {
      const at = Date.now();
      S.kids.forEach((k, i) => S.tx.push({ id:uid() + i, kid:k.id, date:sheet.date, type:'in', icon:'💰', label:'お給料', amount:S.settings.payday, counts:[...S.settings.payCounts], memo:'', at, payday:true }));
      save(); closeSheet(); render(); toast(`${S.kids.length}人に支給しました`);
      break;
    }
    case 'pay-edit': openSheet({ kind:'payamt', counts:[...S.settings.payCounts] }); break;
    case 'payamt-save':
      S.settings.payCounts = [...sheet.counts]; S.settings.payday = total(sheet.counts);
      save(); closeSheet(); render(); toast('支給額を保存しました'); break;

    case 'kid-new': openSheet({ kind:'kid', id:null, name:'', icon:KID_ICONS[S.kids.length % KID_ICONS.length] }); break;
    case 'kid-edit': { const k = kid(view.id); openSheet({ kind:'kid', id:k.id, name:k.name, icon:k.icon }); break; }
    case 'kid-icon':
      sheet.icon = t.dataset.icon;
      document.querySelectorAll('.icons button').forEach(b => b.classList.toggle('on', b.dataset.icon === sheet.icon));
      break;
    case 'kid-save': {
      const name = sheet.name.trim();
      if (sheet.id){ const k = kid(sheet.id); k.name = name; k.icon = sheet.icon; toast('保存しました'); }
      else { S.kids.push({ id:uid(), name, icon:sheet.icon }); toast(`${name}を登録しました`); }
      save(); closeSheet(); render(); break;
    }
    case 'kid-del': {
      const k = kid(sheet.id);
      const n = S.tx.filter(x => x.kid === k.id).length;
      if (!confirm(`${k.name}と、その記録${n}件を削除します。元に戻せません。よろしいですか？`)) break;
      S.kids = S.kids.filter(x => x.id !== k.id); S.tx = S.tx.filter(x => x.kid !== k.id);
      save(); closeSheet(); go({ name:'home' }); toast('削除しました'); break;
    }

    case 'tx-edit': {
      const x = S.tx.find(y => String(y.id) === t.dataset.id); if (!x) break;
      if (x.type === 'ex'){
        openSheet({ kind:'ex', editId:x.id, base:holdings(view.id, x.id), delta:[...x.delta], date:x.date });
        break;
      }
      const ps = S.settings.presets[x.type];
      const p = ps.find(q => q.id === x.presetId) || (x.payday ? null : ps.find(q => q.label === x.label && q.icon === x.icon));
      openSheet({ kind:'rec', editId:x.id, type:x.type, presetId:p ? p.id : null, qty:x.qty || 1, counts:[...countsOf(x)],
        memo:x.memo || '', date:x.date, origLabel:x.label, origIcon:x.icon });
      break;
    }
    case 'tx-del': {
      const x = S.tx.find(y => y.id === sheet.editId);
      if (!confirm(`${md(x.date)}「${x.label}」${x.type === 'ex' ? exText(x.delta) : (x.type === 'in' ? '＋' : '−') + compactCounts(countsOf(x))} を削除しますか？`)) break;
      S.tx = S.tx.filter(y => y.id !== x.id); save(); closeSheet(); render(); toast('記録を削除しました'); break;
    }

    case 'preset-new': openSheet({ kind:'preset', type:t.dataset.type, id:null, label:'', icon:t.dataset.type === 'in' ? '🌱' : '🛒', group:'', counts:[0,0,0,0,0] }); break;
    case 'preset-edit': {
      const p = S.settings.presets[t.dataset.type].find(x => x.id === t.dataset.id);
      openSheet({ kind:'preset', type:t.dataset.type, id:p.id, label:p.label, icon:p.icon, group:p.group || '', counts:pCounts(p) }); break;
    }
    case 'preset-save': {
      const list = S.settings.presets[sheet.type];
      const data = { label:sheet.label.trim(), icon:sheet.icon.trim(), group:sheet.group.trim(), counts:[...sheet.counts], amount:total(sheet.counts) };
      if (sheet.id) Object.assign(list.find(x => x.id === sheet.id), data);
      else list.push({ id:'p-' + uid(), ...data });
      save(); closeSheet(); render(); toast('項目を保存しました'); break;
    }
    case 'preset-del': {
      if (S.settings.presets[sheet.type].length <= 1){ toast('項目は最低1つ必要です'); break; }
      if (!confirm('この項目を削除しますか？（これまでの記録は消えません）')) break;
      S.settings.presets[sheet.type] = S.settings.presets[sheet.type].filter(x => x.id !== sheet.id);
      save(); closeSheet(); render(); toast('項目を削除しました'); break;
    }

    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = `okozukai-${today()}.json`;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('書き出しました'); break;
    }
    case 'reset':
      if (!confirm('園児と記録をすべて消します。元に戻せません。先にバックアップを書き出しましたか？')) break;
      S = defaults(); save(); go({ name:'home' }); toast('リセットしました'); break;
  }
});

document.addEventListener('input', e => {
  if (!sheet) return;
  const id = e.target.id, v = e.target.value;
  if (id === 'f-memo') sheet.memo = v;
  if (id === 'f-date') sheet.date = v;
  if (id === 'f-name') sheet.name = v;
  if (id === 'f-label') sheet.label = v;
  if (id === 'f-icon') sheet.icon = v;
  if (id === 'f-group') sheet.group = v;
  if (/^st-[0-4]$/.test(id)){
    const n = parseInt(v, 10);
    sheet.counts[+id.slice(3)] = Number.isFinite(n) && n > 0 ? n : 0;
    const tt = document.getElementById('st-total'); if (tt) tt.textContent = compactCounts(sheet.counts);
  }
  if (id === 'f-qty'){
    const n = parseInt(v, 10);
    if (Number.isFinite(n) && n >= 1){
      const p = S.settings.presets[sheet.type].find(x => x.id === sheet.presetId);
      sheet.qty = n;
      sheet.counts = pCounts(p).map(q => q * n);
      sheet.counts.forEach((q, i) => { const el = document.getElementById('st-' + i); if (el) el.value = q; });
      document.getElementById('st-total').textContent = compactCounts(sheet.counts);
    }
  }
  validate();
});

document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input[type="number"]')) e.target.select(); });
document.addEventListener('focusout', e => {
  if (!sheet || !e.target.id) return;
  if (/^st-[0-4]$/.test(e.target.id)) e.target.value = sheet.counts[+e.target.id.slice(3)];
  if (e.target.id === 'f-qty') e.target.value = sheet.qty;
});
document.addEventListener('change', e => {
  if (e.target.id !== 'import') return;
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.kids) || !Array.isArray(d.tx) || !d.settings) throw new Error('bad');
      if (!confirm(`園児${d.kids.length}人・記録${d.tx.length}件のデータで、いまのデータを置き換えます。よろしいですか？`)) return;
      S = d; save(); go({ name:'home' }); toast('読み込みました');
    } catch(err) { toast('このファイルは読み込めません'); }
    finally { e.target.value = ''; }
  };
  r.readAsText(file);
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });

render();
</script>
</body>
</html>
